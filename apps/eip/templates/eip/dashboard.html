<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EIP Control</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0d1117;
      --panel: #151b23;
      --panel-strong: #1d2630;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --good: #3fb950;
      --warn: #d29922;
      --bad: #f85149;
      --accent: #58a6ff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    main {
      width: min(1120px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 24px 0 32px;
    }

    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.1;
      font-weight: 650;
    }

    .subline {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 8px;
      color: var(--muted);
      font-size: 14px;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 32px;
      padding: 0 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--panel);
      color: var(--muted);
      font-size: 14px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .status::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--muted);
    }

    .status.online::before { background: var(--good); }
    .status.offline::before { background: var(--bad); }
    .status.checking::before { background: var(--warn); }

    .grid {
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 16px;
      align-items: start;
    }

    .section {
      border-top: 1px solid var(--border);
      padding-top: 16px;
    }

    .section + .section { margin-top: 22px; }

    h2 {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    button {
      width: 100%;
      min-height: 52px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--panel);
      color: var(--text);
      cursor: pointer;
      font: inherit;
      text-align: left;
      padding: 0 14px;
      transition: background 120ms ease, border-color 120ms ease;
    }

    button:hover:not(:disabled), button:focus-visible:not(:disabled) {
      background: var(--panel-strong);
      border-color: var(--accent);
      outline: none;
    }

    button:disabled {
      cursor: not-allowed;
      color: #6e7681;
      opacity: .72;
    }

    .button-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 15px;
      font-weight: 620;
    }

    .mode {
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
      text-transform: uppercase;
    }

    .side {
      position: sticky;
      top: 16px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--panel);
      overflow: hidden;
    }

    .side-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
    }

    .side-title {
      font-size: 13px;
      font-weight: 680;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .06em;
    }

    .mini {
      width: auto;
      min-height: 30px;
      padding: 0 10px;
      text-align: center;
      font-size: 12px;
    }

    pre {
      min-height: 260px;
      max-height: 62vh;
      margin: 0;
      padding: 14px;
      overflow: auto;
      color: #c9d1d9;
      background: #0b0f14;
      white-space: pre-wrap;
      word-break: break-word;
      font: 12px/1.55 ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
    }

    .muted { color: var(--muted); }

    @media (max-width: 820px) {
      main { width: min(100vw - 20px, 680px); padding-top: 16px; }
      header { align-items: start; flex-direction: column; }
      .grid { grid-template-columns: 1fr; }
      .actions { grid-template-columns: 1fr; }
      .side { position: static; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Edge Infrastructure Platform</h1>
        <div class="subline">
          <span>{{ status.host }}:{{ status.port }}</span>
          <span class="muted">{{ status.timestamp }}</span>
        </div>
      </div>
      <div id="hub-status" class="status {{ status.status | lower }}">{{ status.status }}</div>
    </header>

    <div class="grid">
      <div>
        {% for group, group_actions in actions_by_group.items() %}
          <section class="section">
            <h2>{{ group }}</h2>
            <div class="actions">
              {% for action in group_actions %}
                <button
                  type="button"
                  data-action="{{ action.id }}"
                  {% if not action.available %}disabled title="{{ action.unavailable_reason }}"{% endif %}
                >
                  <span class="button-label">
                    <span>{{ action.label }}</span>
                    <span class="mode">{{ action.mode }}</span>
                  </span>
                </button>
              {% endfor %}
            </div>
          </section>
        {% endfor %}
      </div>

      <aside class="side">
        <div class="side-head">
          <span class="side-title">Output</span>
          <button class="mini" type="button" id="refresh-status">Refresh</button>
        </div>
        <pre id="output">{{ output or "Ready." }}</pre>
      </aside>
    </div>
  </main>

  <script>
    const output = document.querySelector('#output');
    const statusEl = document.querySelector('#hub-status');
    const actionBase = '{{ url_for("eip.actions") }}';

    function writeOutput(text) {
      output.textContent = text || 'Done.';
    }

    function setStatus(body) {
      statusEl.textContent = body.status;
      statusEl.className = `status ${String(body.status || '').toLowerCase()}`;
    }

    async function refreshStatus() {
      statusEl.textContent = 'CHECKING';
      statusEl.className = 'status checking';
      const resp = await fetch('{{ url_for("eip.hub_status") }}');
      const body = await resp.json();
      setStatus(body);
      return body;
    }

    document.querySelector('#refresh-status').addEventListener('click', async () => {
      try {
        const body = await refreshStatus();
        writeOutput(JSON.stringify(body, null, 2));
      } catch (err) {
        writeOutput(String(err));
      }
    });

    document.querySelectorAll('[data-action]').forEach((button) => {
      button.addEventListener('click', async () => {
        const id = button.dataset.action;
        const label = button.querySelector('.button-label span').textContent.trim();
        button.disabled = true;
        writeOutput(`Running ${label}...`);
        try {
          const resp = await fetch(`${actionBase}/${id}`, { method: 'POST' });
          const body = await resp.json();
          writeOutput(body.output || JSON.stringify(body, null, 2));
          await refreshStatus();
        } catch (err) {
          writeOutput(String(err));
        } finally {
          button.disabled = false;
        }
      });
    });
  </script>
</body>
</html>
